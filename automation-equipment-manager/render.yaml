services:
  - type: web
    name: automation-equipment-manager-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-domain.vercel.app
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: AEM_TOKEN_SECRET
        sync: false
    disk:
      name: automation-equipment-manager-data
      mountPath: /var/data
      sizeGB: 1
